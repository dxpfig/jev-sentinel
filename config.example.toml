# jev-sentinel 配置示例
# 复制为 config.toml 后按需修改。敏感信息（webhook / api_key）建议走环境变量，不要提交进仓库。

[agent]
interval_seconds = 60
cooldown_seconds = 3600
grace_scans = 3
horizon_seconds = 86400
max_lines_per_scan = 500
timezone_hours = 8

[[logs]]
path = "/var/log/myapp/*.log"
tail_bytes = 131072
max_lines = 1000

[health]
processes = ["myapp.exe"]
tcp = ["127.0.0.1:8080"]

[classifier]
type = "jev"
enabled = true
threshold = 0.5
model = ""
base_url = ""

[llm]
base_url = ""
model = ""
api_key = ""
timeout = 45
max_tokens = 2400
temperature = 0.2

[notifier]
type = "feishu"
webhook = ""
secret = ""
timeout = 5

