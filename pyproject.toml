[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-sentinel"
version = "0.1.0"
description = "通用日志运维哨兵：本地小模型第一层异常判断 + 云端 LLM 诊断 + 飞书/webhook 告警"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["ops", "monitoring", "logs", "agent", "llm", "feishu", "jev-style", "sentinel"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Logging",
]

[project.optional-dependencies]
jev = ["jev-style>=0.5"]
dev = ["pytest>=8"]

[project.scripts]
jev-sentinel = "jev_sentinel.cli:main"

[tool.setuptools]
packages = ["jev_sentinel"]

